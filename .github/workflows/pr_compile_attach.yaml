name: Attach Compile Artifacts

on:
  pull_request:

jobs:
  typst-compile-attach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0  # 変更を比較するために履歴全体を取得

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto fonts-noto-cjk fonts-noto-cjk-extra ttf-mscorefonts-installer

      - name: Set up Typst
        uses: typst-community/setup-typst@f5c90506c7ae74fca20e339034af05c52e0eda92 # v3.1.0

      - name: Compile Typst files
        run: |
          # 変更されたTypstファイルを取得（-z オプションでnull区切り、--no-quotesでクォートなし）
          git diff -z --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | \
          grep -z '\.typ$' | \
          while IFS= read -r -d '' file; do
            echo "Processing: $file"
            if [ -f "$file" ]; then
              echo "Compiling $file"
              typst compile "$file" || echo "Failed to compile $file"
            else
              echo "File not found: $file"
            fi
          done

          # 少なくとも1つのファイルが処理されたか確認
          if ! git diff --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -q '\.typ$'; then
            echo "No Typst files changed in this PR"
          fi

      - name: Attach PDFs to PR
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compiled-pdfs
          path: '**/*.pdf'
          if-no-files-found: warn

      - name: Comment on PR with artifact info
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4.6.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            📝 The Typst files changed in this PR have been compiled. You can download the compiled PDFs from the "compiled-pdfs" artifact attached to this workflow run.
