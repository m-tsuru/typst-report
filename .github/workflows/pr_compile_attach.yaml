name: Attach Compile Artifacts

on:
  pull_request:

jobs:
  typst-compile-attach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0  # 変更を比較するために履歴全体を取得

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto fonts-noto-cjk fonts-noto-cjk-extra ttf-mscorefonts-installer

      - name: Set up Typst
        uses: typst-community/setup-typst@f5c90506c7ae74fca20e339034af05c52e0eda92 # v3.1.0

      - name: Compile Typst files
        run: |
          # 変更されたTypstファイルを取得
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep '\.typ' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No Typst files changed in this PR"
            exit 0
          fi

          echo "Changed Typst files:"
          echo "$CHANGED_FILES"

          # 各ファイルをコンパイル
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "Compiling $file"
              typst compile "$file"
            fi
          done <<< "$CHANGED_FILES"

      - name: Attach PDFs to PR
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compiled-pdfs
